services:
  - type: worker
    name: dnd-discord-bot
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dnd-discord-db
          property: connectionString

databases:
  - name: dnd-discord-db
    plan: basic-256mb

